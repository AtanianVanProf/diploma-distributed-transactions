server:
  port: 8112

spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5472}/inventory_db
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
