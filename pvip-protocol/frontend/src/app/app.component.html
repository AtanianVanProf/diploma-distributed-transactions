<div class="app-container">
  <header class="app-header">
    <h1>PVIP Protocol Demo</h1>
    <p class="subtitle">Pre-Validated Intent Protocol — Zero Compensating Transactions</p>
  </header>

  <main class="main-content">
    <section class="interaction-section">
      <div class="form-column">
        <app-order-form
          [customers]="customers"
          [products]="products"
          [isProcessing]="isProcessing"
          (orderSubmit)="onOrderSubmit($event)"
          (resetRequested)="onReset()" />
      </div>
      <div class="result-column">
        <app-transaction-result [result]="transactionResult" />
        <app-state-diff
          [before]="transactionResult?.beforeState ?? null"
          [after]="transactionResult?.afterState ?? null" />
      </div>
    </section>

    <section class="dashboard-section">
      <div class="dashboard-grid">
        <app-inventory-panel [products]="products" />
        <app-payment-panel [customers]="customers" />
      </div>
      <app-order-panel [orders]="orders" />
      <app-protocol-panel [executions]="executions" />
    </section>
  </main>
</div>
