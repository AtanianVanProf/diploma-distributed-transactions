server:
  port: 8111

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5471}/order_db
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

services:
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8112}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8113}
  commitgate-url: ${COMMITGATE_SERVICE_URL:http://localhost:8114}
