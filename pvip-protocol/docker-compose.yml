services:
  pvip-order-db:
    image: postgres:16-alpine
    container_name: pvip-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5471:5432"
    volumes:
      - pvip-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pvip-network

  pvip-inventory-db:
    image: postgres:16-alpine
    container_name: pvip-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5472:5432"
    volumes:
      - pvip-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pvip-network

  pvip-payment-db:
    image: postgres:16-alpine
    container_name: pvip-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5473:5432"
    volumes:
      - pvip-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pvip-network

  pvip-commitgate-db:
    image: postgres:16-alpine
    container_name: pvip-commitgate-db
    environment:
      POSTGRES_DB: commitgate_db
      POSTGRES_USER: commitgate
      POSTGRES_PASSWORD: commitgate
    ports:
      - "5474:5432"
    volumes:
      - pvip-commitgate-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitgate -d commitgate_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pvip-network

  pvip-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pvip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pvip-network

  pvip-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pvip-kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: pvip-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pvip-kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      pvip-zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - pvip-network

  pvip-inventory-service:
    build:
      context: ./inventory-service
    container_name: pvip-inventory-service
    ports:
      - "8112:8112"
    depends_on:
      pvip-inventory-db:
        condition: service_healthy
      pvip-kafka:
        condition: service_healthy
    networks:
      - pvip-network

  pvip-payment-service:
    build:
      context: ./payment-service
    container_name: pvip-payment-service
    ports:
      - "8113:8113"
    depends_on:
      pvip-payment-db:
        condition: service_healthy
      pvip-kafka:
        condition: service_healthy
    networks:
      - pvip-network

  pvip-commitgate-service:
    build:
      context: ./commitgate-service
    container_name: pvip-commitgate-service
    ports:
      - "8114:8114"
    depends_on:
      pvip-commitgate-db:
        condition: service_healthy
      pvip-kafka:
        condition: service_healthy
    networks:
      - pvip-network

  pvip-order-service:
    build:
      context: ./order-service
    container_name: pvip-order-service
    ports:
      - "8111:8111"
    depends_on:
      pvip-order-db:
        condition: service_healthy
      pvip-kafka:
        condition: service_healthy
      pvip-inventory-service:
        condition: service_started
      pvip-payment-service:
        condition: service_started
      pvip-commitgate-service:
        condition: service_started
    networks:
      - pvip-network

  pvip-frontend:
    build:
      context: ./frontend
    container_name: pvip-frontend
    ports:
      - "4204:80"
    depends_on:
      pvip-order-service:
        condition: service_started
      pvip-inventory-service:
        condition: service_started
      pvip-payment-service:
        condition: service_started
      pvip-commitgate-service:
        condition: service_started
    networks:
      - pvip-network

volumes:
  pvip-order-data:
  pvip-inventory-data:
  pvip-payment-data:
  pvip-commitgate-data:

networks:
  pvip-network:
    driver: bridge
