server:
  port: 8114

spring:
  application:
    name: commitgate-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5474}/commitgate_db
    username: ${DB_USER:commitgate}
    password: ${DB_PASSWORD:commitgate}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

pvip:
  expected-participants: 2
  timeout-ms: 5000
